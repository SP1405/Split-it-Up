<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split It Up Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&family=Inter:wght@400;500;600;700&family=Libre+Barcode+39+Text&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .home { max-width: 460px; margin: 34px auto 0; }
  </style>
</head>
<body>
  <main class="page">
    <header class="app-top">
      <p class="wordmark">Split It Up</p>
      <nav id="tabs"></nav>
    </header>

    <section class="home">
      <div class="balance">
        <div>
          <p class="balance__label">Still owed to you</p>
          <p class="balance__amount" id="owed">$0.00</p>
        </div>
        <button class="btn btn--grey btn--sm" id="hide" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="slash" d="M4 4l16 16"/></svg>
          <span id="hide-text">Hide balance</span>
        </button>
      </div>

      <div class="wallet" id="wallet">
        <div class="wallet__back"></div>
        <a class="wallet__new" href="/scan.html">+ New receipt</a>
        <div class="wallet__slot" id="slot"></div>
        <div class="wallet__pocket-wrap">
          <div class="wallet__pocket" id="pocket">
            <span class="wallet__engrave">Split It Up</span>
            <span class="wallet__count" id="count">0 receipts</span>
          </div>
        </div>
      </div>

      <button class="wallet-hint" id="toggle" aria-expanded="false" aria-controls="slot">
        <span id="toggle-text">Tap to see all your receipts</span> <span aria-hidden="true">›</span>
      </button>
    </section>
  </main>

  <script src="/ui.js"></script>
  <script>
    const S = window.SplitItUp;
    S.confetti({ count: 38 });
    S.tabs(document.getElementById("tabs"), "wallet");

    const $ = (id) => document.getElementById(id);
    const wallet = $("wallet"), slot = $("slot");
    const MAX = 8;

    // ?demo shows sample receipts (handy for screenshots before any real bills exist)
    const DEMO = [
      { id: "c91d", merchant: "Boba Guys", createdAt: "2026-11-02T19:00:00", itemCount: 4, totalCents: 2850, paidCents: 2850 },
      { id: "b77q9", merchant: "Corner Deli", createdAt: "2026-11-08T13:10:00", itemCount: 6, totalCents: 4120, paidCents: 1830 },
      { id: "a8f3k2", merchant: "Taco Palace", createdAt: "2026-11-10T20:30:00", itemCount: 5, totalCents: 6575, paidCents: 0 },
    ];

    async function loadBills() {
      if (new URLSearchParams(location.search).has("demo")) return DEMO;
      try {
        const res = await fetch("/api/bills");
        return res.ok ? await res.json() : [];
      } catch {
        return [];
      }
    }

    const shortDate = (d) => d
      ? new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric" }).toUpperCase()
      : "";

    function cardHTML(b) {
      const pct = b.totalCents ? Math.min(100, Math.round((b.paidCents / b.totalCents) * 100)) : 0;
      return `<div class="wcard__paper">
        <div class="wcard__row"><b>${S.esc(b.merchant)}</b><b>${S.money(b.totalCents)}</b></div>
        <div class="wcard__row"><span>${shortDate(b.createdAt)}</span><span>${b.itemCount} ITEMS</span></div>
        <hr />
        <div class="wcard__row"><span>PAID</span><span>${S.money(b.paidCents)} / ${S.money(b.totalCents)}</span></div>
        <div class="wcard__bar" role="img" aria-label="${pct}% paid"><span style="width:${pct}%"></span></div>
        <div class="wcard__barcode" aria-hidden="true">${S.esc(S.barcode(b.id))}</div>
      </div>`;
    }

    function setOpen(open) {
      wallet.classList.toggle("is-open", open);
      $("toggle").setAttribute("aria-expanded", open);
      $("toggle-text").textContent = open ? "Put them back" : "Tap to see all your receipts";
      slot.querySelectorAll("a.wcard").forEach((a) => (a.tabIndex = open ? 0 : -1));
    }

    function render(bills) {
      const shown = bills.slice(-MAX); // newest sits in front
      wallet.style.setProperty("--n", Math.max(1, shown.length));
      $("count").textContent = `${bills.length} receipt${bills.length === 1 ? "" : "s"}`;

      const owed = bills.reduce((s, b) => s + Math.max(0, b.totalCents - b.paidCents), 0);
      $("owed").dataset.value = S.money(owed);
      applyHidden();

      if (!shown.length) {
        slot.innerHTML = `<div class="wcard wcard--empty"><div class="wcard__paper">
          <b style="font-size:1rem">NOTHING IN HERE YET</b>
          <span class="muted" style="text-transform:none;font-family:var(--font-body);margin-top:6px">Tap “+ New receipt” to scan one</span>
        </div></div>`;
        $("toggle").hidden = true;
        return;
      }

      slot.innerHTML = "";
      shown.forEach((b, i) => {
        const a = document.createElement("a");
        a.className = "wcard";
        a.href = `/b/${encodeURIComponent(b.id)}/host`;
        a.setAttribute("aria-label", `${b.merchant}, ${S.money(b.totalCents)}, ${S.money(b.paidCents)} paid`);
        a.style.setProperty("--i", i);
        a.style.setProperty("--rot", S.tiltFor(b.id, 1.6).toFixed(2) + "deg");
        a.innerHTML = cardHTML(b);
        // first tap fans the stack out; once open, tapping a receipt opens it
        a.addEventListener("click", (e) => {
          if (!wallet.classList.contains("is-open")) { e.preventDefault(); setOpen(true); }
        });
        slot.appendChild(a);
      });
      setOpen(false);
    }

    // hide balance (remembered per browser)
    let hidden = false;
    try { hidden = localStorage.getItem("ss-hide-balance") === "1"; } catch {}
    function applyHidden() {
      const el = $("owed");
      el.textContent = hidden ? "$•••••" : el.dataset.value || "$0.00";
      el.classList.toggle("is-hidden", hidden);
      $("hide").setAttribute("aria-pressed", hidden);
      $("hide-text").textContent = hidden ? "Show balance" : "Hide balance";
      $("slash").style.display = hidden ? "none" : "";
    }
    $("hide").onclick = () => {
      hidden = !hidden;
      try { localStorage.setItem("ss-hide-balance", hidden ? "1" : "0"); } catch {}
      applyHidden();
    };

    $("toggle").onclick = () => setOpen(!wallet.classList.contains("is-open"));
    $("pocket").onclick = () => setOpen(!wallet.classList.contains("is-open"));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpen(false); });

    loadBills().then(render);
  </script>
</body>
</html>
